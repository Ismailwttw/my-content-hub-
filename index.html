<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYAA Content Manager - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-between">
    <div class="max-w-xl w-full mx-auto p-6 bg-white rounded-2xl shadow-lg mt-10 mb-10">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Admin Control Panel</h2>
            <p class="text-sm text-gray-500 mt-1">Manage your website categories and content effortlessly</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Select Category:</label>
                <select id="categorySelect" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="">-- Choose Category --</option>
                    <option value="tech">Tech & Gadgets</option>
                    <option value="digital">Digital Hub</option>
                    <option value="general">General Updates</option>
                </select>
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Item Title / Heading:</label>
                <input type="text" id="catTitle" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter title or heading">
            </div>
            
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Content / Description:</label>
                <textarea id="catDesc" rows="5" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Write your detailed description here..."></textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="saveData()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition duration-200 shadow-md">
                    Save Changes
                </button>
                <button onclick="deleteData()" class="px-5 bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition duration-200 shadow-md">
                    Delete
                </button>
            </div>
        </div>

        <div id="statusMessage" class="mt-5 text-center text-sm font-semibold"></div>
    </div>

    <script>
        function saveData() {
            const category = document.getElementById('categorySelect').value;
            const title = document.getElementById('catTitle').value;
            const desc = document.getElementById('catDesc').value;
            const status = document.getElementById('statusMessage');

            if(!category || (!title && !desc)) {
                status.style.color = '#DC2626';
                status.innerText = '⚠️ Please select a category and fill in the title or content!';
                return;
            }

            status.style.color = '#16A34A';
            status.innerText = '✅ Changes saved successfully!';
        }

        function deleteData() {
            const category = document.getElementById('categorySelect').value;
            const status = document.getElementById('statusMessage');

            if(!category) {
                status.style.color = '#DC2626';
                status.innerText = '⚠️ Please select a category to delete!';
                return;
            }

            status.style.color = '#DC2626';
            status.innerText = '🗑️ Selected category data deleted successfully!';
        }
    </script>
</body>
</html>
